<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Eventos</title>
    <link rel="stylesheet" href="../R- CSS/Calendario.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

</head>

<body>
    <header>
        <h1>Calendario Interactivo</h1>
    </header>

    <section class="calendar-container">
        <div id="calendar">
            <div class="calendar-header">
                <button id="prevMonth">Anterior</button>
                <h2 id="currentMonth"></h2>
                <button id="nextMonth">Siguiente</button>
            </div>
            <div class="weekdays">
                <div>Dom</div>
                <div>Lun</div>
                <div>Mar</div>
                <div>Mié</div>
                <div>Jue</div>
                <div>Vie</div>
                <div>Sáb</div>
            </div>
            <div id="days" class="days"></div>
        </div>
    </section>

    <section class="event-section">
        <h2>Agregar Recordatorio</h2>
        <form id="eventForm">
            <input type="date" id="eventDate" required>
            <input type="text" id="eventDescription" placeholder="Descripción del evento" required>
            <button type="submit">Agregar</button>
        </form>
        <div id="eventsList"></div>
    </section>

    <footer>
        <p>&copy; 2024 Calendario de Eventos</p>
    </footer>

    <script src="../R- JAVASCRIPT/Calendario.js"></script>
</body>

</html>
